<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#bb9af7"/>
  <!-- Five bars of a spectrum, tallest in the middle: the panel huruwave draws
       from cava, in short. Same shape of icon as airgraph's (rounded square, dark
       glyph on one accent colour), so the two of them read as a set in a launcher,
       with a different accent so they are told apart at a glance. -->
  <g fill="#0e0e10">
    <rect x="9"  y="36" width="6" height="14" rx="3"/>
    <rect x="19" y="28" width="6" height="22" rx="3"/>
    <rect x="29" y="16" width="6" height="34" rx="3"/>
    <rect x="39" y="24" width="6" height="26" rx="3"/>
    <rect x="49" y="38" width="6" height="12" rx="3"/>
  </g>
</svg>
